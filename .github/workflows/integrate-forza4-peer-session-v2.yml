name: Integrate Forza4 peer session v2

on:
  push:
    branches:
      - refactor/forza4-peer-session

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/forza4-peer-session

      - name: Integrate controller into page
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/pages/Forza4.tsx')
          text = path.read_text()

          def one(pattern, replacement, label, flags=0):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')

          one(r"import Peer, \{ type DataConnection \} from 'peerjs';\n", '', 'PeerJS import')
          one(
              r"import \{\n  createHostCode,\n  isPeerMessage,\n  isValidCode,\n  normalizeCode,\n  type PeerMessage,\n  type SessionScore,\n  type SyncPayload,\n\} from '../games/forza4/protocol';\n\nconst CONNECTION_TIMEOUT_MS = 8_000;\nconst RECONNECT_GRACE_MS = 12_000;\nconst RECONNECT_RETRY_MS = 1_400;\n\ntype GameState = 'setup' \| 'playing' \| 'end';\ntype GameMode = 'online' \| 'local';\ntype ConnectionState = 'idle' \| 'connecting' \| 'connected' \| 'reconnecting' \| 'lost';\ntype PlayerNumber = 0 \| 1 \| 2;\n",
              "import { normalizeCode, type SessionScore, type SyncPayload } from '../games/forza4/protocol';\nimport {\n  Forza4PeerSession,\n  type ConnectionState,\n  type PlayerNumber,\n} from '../games/forza4/peerSession';\n\ntype GameState = 'setup' | 'playing' | 'end';\ntype GameMode = 'online' | 'local';\n",
              'network imports',
          )

          one(
              r"(  const \[incomingRestart, setIncomingRestart\] = useState\(false\);\n\n)",
              r"\1  const peerSessionRef = useRef<Forza4PeerSession | null>(null);\n",
              'session ref',
          )

          for ref_name in [
              'peerRef', 'peerReadyRef', 'connRef', 'connectionTimeoutRef', 'reconnectExpiryRef',
              'reconnectRetryRef', 'reconnectDeadlineRef', 'connectionStateRef', 'remoteIdRef',
              'isHostRef', 'sessionStartedRef', 'intentionalDisconnectRef',
          ]:
              text, count = re.subn(rf"^  const {ref_name} = .*?;\n", '', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'remove {ref_name}: expected 1 match, found {count}')

          one(r"    connectionStateRef\.current = value;\n", '', 'connection state mirror')
          one(
              r"  const clearConnectionTimeout = \(\) => \{.*?\n  const clearDropAnimation = \(\) => \{",
              "  const clearDropAnimation = () => {",
              'network timer helpers',
              re.S,
          )

          network = """  useEffect(() => {
            const session = new Forza4PeerSession({
              onConnectionState: updateConnectionState,
              onStatus: (status, error) => {
                setStatusText(status);
                setStatusError(error);
              },
              onPeerReady: setPeerReady,
              onHostCode: setMyId,
              onRemoteCode: setRemoteId,
              onPrepareOnlineSession: player => {
                resetSession('online');
                setPlayer(player);
              },
              onConnected: ({ reconnected }) => {
                updateMode('online');
                setSearchParams({});
                if (!reconnected) updateGameState('playing');
              },
              onSync: applySync,
              onMove: (col, player) => {
                processMove(col, player);
              },
              onRestartRequest: () => setIncomingRestart(true),
              onRestartAccept: startNextRound,
              onRestartDecline: () => setRestartRequested(false),
              buildSyncPayload,
              isGameOver: () => gameOverRef.current,
              getCurrentPlayer: () => currentPlayerRef.current,
            });

            peerSessionRef.current = session;
            session.setRemoteCode(remoteId);
            session.start(initialJoinIdRef.current);

            return () => {
              peerSessionRef.current = null;
              session.dispose();
              if (dropTimeoutRef.current !== null) window.clearTimeout(dropTimeoutRef.current);
            };
          }, []);

          const connectToPeer = () => {
            if (!peerReady || connectionState === 'connecting') return;
            peerSessionRef.current?.connect(remoteId);
          };

          const startLocalGame"""
          one(r"  const sendSync = \(\) => \{.*?\n  const startLocalGame", network, 'network lifecycle block', re.S)

          local = """  const startLocalGame = () => {
            peerSessionRef.current?.setOnlineEnabled(false);
            resetSession('local');
            setPlayer(0);
            updateConnectionState('idle');
            startRound(1, 1);
          };

          const copyLink"""
          one(r"  const startLocalGame = \(\) => \{.*?\n  \};\n\n  const copyLink", local, 'local start block', re.S)

          one(
              r"    if \(connectionStateRef\.current !== 'connected' \|\| myPlayerNumRef\.current !== player \|\| !connRef\.current\?\.open\) return;\n    if \(processMove\(col, player\)\) connRef\.current\.send\(\{ type: 'move', col, playerNum: player \} satisfies PeerMessage\);",
              "    if (connectionState !== 'connected' || myPlayerNumRef.current !== player || !peerSessionRef.current?.isConnected()) return;\n    if (processMove(col, player)) peerSessionRef.current.sendMove(col, player);",
              'move dispatch',
          )

          actions = """  const requestRestart = () => {
            if (modeRef.current === 'local') {
              startNextRound();
              return;
            }
            if (peerSessionRef.current?.requestRestart()) setRestartRequested(true);
          };

          const acceptRestart = () => {
            if (peerSessionRef.current?.acceptRestart()) startNextRound();
          };

          const declineRestart = () => {
            setIncomingRestart(false);
            peerSessionRef.current?.declineRestart();
          };

          const retryConnection = () => {
            peerSessionRef.current?.retryReconnect();
          };

          const exitToMenu = () => {
            peerSessionRef.current?.dispose();
            peerSessionRef.current = null;
            navigate('/');
          };

          const inviteUrl"""
          one(r"  const requestRestart = \(\) => \{.*?\n  const inviteUrl", actions, 'restart and exit actions', re.S)

          one(
              re.escape("onClick={() => { updateMode('online'); setStatusText('Condividi il codice o entra in una partita'); }}"),
              "onClick={() => { updateMode('online'); peerSessionRef.current?.setOnlineEnabled(true); setStatusText('Condividi il codice o entra in una partita'); setStatusError(false); }}",
              'online setup button',
          )
          one(
              re.escape("onClick={() => { updateMode('local'); setStatusText('Pronto per una partita sullo stesso telefono'); }}"),
              "onClick={() => { updateMode('local'); peerSessionRef.current?.setOnlineEnabled(false); setStatusText('Pronto per una partita sullo stesso telefono'); setStatusError(false); }}",
              'local setup button',
          )
          one(
              re.escape("onChange={event => { const code = normalizeCode(event.target.value); setRemoteId(code); remoteIdRef.current = code; }}"),
              "onChange={event => { const code = normalizeCode(event.target.value); setRemoteId(code); peerSessionRef.current?.setRemoteCode(code); }}",
              'remote code input',
          )

          path.write_text(text)

          session_path = Path('src/games/forza4/peerSession.ts')
          session = session_path.read_text()
          marker = "  sendMove(col: number, player: Forza4Player) {\n"
          if session.count(marker) != 1:
              raise SystemExit('isConnected marker not found exactly once')
          session = session.replace(
              marker,
              "  isConnected() {\n    return this.connectionState === 'connected' && Boolean(this.connection?.open);\n  }\n\n" + marker,
              1,
          )
          session_path.write_text(session)

      - name: Remove temporary workflows
        run: rm .github/workflows/integrate-forza4-peer-session.yml .github/workflows/integrate-forza4-peer-session-v2.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Forza4.tsx src/games/forza4/peerSession.ts .github/workflows/integrate-forza4-peer-session.yml .github/workflows/integrate-forza4-peer-session-v2.yml
          git commit -m "refactor: wire Forza 4 peer session controller"
          git push origin HEAD:refactor/forza4-peer-session
