name: Fix Forza 4 import

on:
  push:
    branches:
      - refactor/forza4-game-logic

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/forza4-game-logic

      - name: Remove unused import
        run: |
          sed -i "/FORZA4_ROWS as ROWS,/d" src/pages/Forza4.tsx
          rm .github/workflows/fix-forza4-import.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Forza4.tsx .github/workflows/fix-forza4-import.yml
          git commit -m "fix: remove unused Forza 4 row import"
          git push origin HEAD:refactor/forza4-game-logic
