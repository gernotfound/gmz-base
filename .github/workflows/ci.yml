name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Normalize dependencies
        run: bun install

      - name: Upload normalized lockfile
        uses: actions/upload-artifact@v4
        with:
          name: normalized-lockfile
          path: bun.lock

      - name: TypeScript check
        run: bun run check

      - name: Production build
        run: bun run build
