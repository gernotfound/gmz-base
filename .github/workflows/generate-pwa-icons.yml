name: Generate PWA icons

on:
  push:
    branches:
      - feat/pwa-resilience

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/pwa-resilience

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate raster icons
        run: |
          node <<'NODE'
          const sharp = require('sharp');

          async function run() {
            await sharp('public/icon.svg').resize(192, 192).png().toFile('public/icon-192.png');
            await sharp('public/icon.svg').resize(512, 512).png().toFile('public/icon-512.png');
            await sharp('public/icon.svg').resize(180, 180).png().toFile('public/apple-touch-icon.png');

            const safeIcon = await sharp('public/icon.svg').resize(384, 384).png().toBuffer();
            await sharp({
              create: {
                width: 512,
                height: 512,
                channels: 4,
                background: '#070b14',
              },
            })
              .composite([{ input: safeIcon, left: 64, top: 64 }])
              .png()
              .toFile('public/icon-maskable-512.png');
          }

          run().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit generated icons and remove temporary workflow
        run: |
          rm .github/workflows/generate-pwa-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icon-192.png public/icon-512.png public/icon-maskable-512.png public/apple-touch-icon.png .github/workflows/generate-pwa-icons.yml
          git commit -m "feat: add PWA raster icons"
          git push origin HEAD:feat/pwa-resilience
