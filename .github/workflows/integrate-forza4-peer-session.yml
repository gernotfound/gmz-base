name: Integrate Forza4 peer session

on:
  push:
    branches:
      - refactor/forza4-peer-session

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/forza4-peer-session

      - name: Integrate controller into page
        shell: python
        run: |
          from pathlib import Path
          import re

          page_path = Path('src/pages/Forza4.tsx')
          text = page_path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once("import Peer, { type DataConnection } from 'peerjs';\n", '', 'PeerJS import')

          replace_once("""import {
            createHostCode,
            isPeerMessage,
            isValidCode,
            normalizeCode,
            type PeerMessage,
            type SessionScore,
            type SyncPayload,
          } from '../games/forza4/protocol';

          const CONNECTION_TIMEOUT_MS = 8_000;
          const RECONNECT_GRACE_MS = 12_000;
          const RECONNECT_RETRY_MS = 1_400;

          type GameState = 'setup' | 'playing' | 'end';
          type GameMode = 'online' | 'local';
          type ConnectionState = 'idle' | 'connecting' | 'connected' | 'reconnecting' | 'lost';
          type PlayerNumber = 0 | 1 | 2;
          """, """import { normalizeCode, type SessionScore, type SyncPayload } from '../games/forza4/protocol';
          import {
            Forza4PeerSession,
            type ConnectionState,
            type PlayerNumber,
          } from '../games/forza4/peerSession';

          type GameState = 'setup' | 'playing' | 'end';
          type GameMode = 'online' | 'local';
          """, 'network imports and types')

          replace_once("  const [incomingRestart, setIncomingRestart] = useState(false);\n\n", "  const [incomingRestart, setIncomingRestart] = useState(false);\n\n  const peerSessionRef = useRef<Forza4PeerSession | null>(null);\n", 'peer session ref insertion')

          for line in [
              "  const peerRef = useRef<Peer | null>(null);\n",
              "  const peerReadyRef = useRef(false);\n",
              "  const connRef = useRef<DataConnection | null>(null);\n",
              "  const connectionTimeoutRef = useRef<number | null>(null);\n",
              "  const reconnectExpiryRef = useRef<number | null>(null);\n",
              "  const reconnectRetryRef = useRef<number | null>(null);\n",
              "  const reconnectDeadlineRef = useRef(0);\n",
              "  const connectionStateRef = useRef<ConnectionState>('idle');\n",
              "  const remoteIdRef = useRef(remoteId);\n",
              "  const isHostRef = useRef(false);\n",
              "  const sessionStartedRef = useRef(false);\n",
              "  const intentionalDisconnectRef = useRef(false);\n",
          ]:
              replace_once(line, '', f'remove ref {line.strip()}')

          replace_once("""  const updateConnectionState = (value: ConnectionState) => {
            connectionStateRef.current = value;
            setConnectionState(value);
          };
          """, """  const updateConnectionState = (value: ConnectionState) => {
            setConnectionState(value);
          };
          """, 'connection state updater')

          pattern = re.compile(r"  const clearConnectionTimeout = \(\) => \{.*?\n  const clearDropAnimation = \(\) => \{", re.S)
          text, count = pattern.subn("  const clearDropAnimation = () => {", text, count=1)
          if count != 1:
              raise SystemExit(f'clear timer helpers: expected 1 match, found {count}')

          new_network_block = """  useEffect(() => {
            const session = new Forza4PeerSession({
              onConnectionState: updateConnectionState,
              onStatus: (status, error) => {
                setStatusText(status);
                setStatusError(error);
              },
              onPeerReady: setPeerReady,
              onHostCode: setMyId,
              onRemoteCode: setRemoteId,
              onPrepareOnlineSession: player => {
                resetSession('online');
                setPlayer(player);
              },
              onConnected: ({ reconnected }) => {
                updateMode('online');
                setSearchParams({});
                if (!reconnected) updateGameState('playing');
              },
              onSync: applySync,
              onMove: (col, player) => {
                processMove(col, player);
              },
              onRestartRequest: () => setIncomingRestart(true),
              onRestartAccept: startNextRound,
              onRestartDecline: () => setRestartRequested(false),
              buildSyncPayload,
              isGameOver: () => gameOverRef.current,
              getCurrentPlayer: () => currentPlayerRef.current,
            });

            peerSessionRef.current = session;
            session.setRemoteCode(remoteId);
            session.start(initialJoinIdRef.current);

            return () => {
              peerSessionRef.current = null;
              session.dispose();
              if (dropTimeoutRef.current !== null) window.clearTimeout(dropTimeoutRef.current);
            };
          }, []);

          const connectToPeer = () => {
            if (!peerReady || connectionState === 'connecting') return;
            peerSessionRef.current?.connect(remoteId);
          };

          const startLocalGame"""

          pattern = re.compile(r"  const sendSync = \(\) => \{.*?\n  const startLocalGame", re.S)
          text, count = pattern.subn(new_network_block, text, count=1)
          if count != 1:
              raise SystemExit(f'network block: expected 1 match, found {count}')

          pattern = re.compile(r"  const startLocalGame = \(\) => \{.*?\n  \};\n\n  const copyLink", re.S)
          replacement = """  const startLocalGame = () => {
            peerSessionRef.current?.setOnlineEnabled(false);
            resetSession('local');
            setPlayer(0);
            updateConnectionState('idle');
            startRound(1, 1);
          };

          const copyLink"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'startLocalGame: expected 1 match, found {count}')

          replace_once("""    if (connectionStateRef.current !== 'connected' || myPlayerNumRef.current !== player || !connRef.current?.open) return;
            if (processMove(col, player)) connRef.current.send({ type: 'move', col, playerNum: player } satisfies PeerMessage);
          """, """    if (connectionState !== 'connected' || myPlayerNumRef.current !== player || !peerSessionRef.current?.isConnected()) return;
            if (processMove(col, player)) peerSessionRef.current.sendMove(col, player);
          """, 'move sending')

          pattern = re.compile(r"  const requestRestart = \(\) => \{.*?\n  const inviteUrl", re.S)
          replacement = """  const requestRestart = () => {
            if (modeRef.current === 'local') {
              startNextRound();
              return;
            }
            if (peerSessionRef.current?.requestRestart()) setRestartRequested(true);
          };

          const acceptRestart = () => {
            if (peerSessionRef.current?.acceptRestart()) startNextRound();
          };

          const declineRestart = () => {
            setIncomingRestart(false);
            peerSessionRef.current?.declineRestart();
          };

          const retryConnection = () => {
            peerSessionRef.current?.retryReconnect();
          };

          const exitToMenu = () => {
            peerSessionRef.current?.dispose();
            peerSessionRef.current = null;
            navigate('/');
          };

          const inviteUrl"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'restart/exit actions: expected 1 match, found {count}')

          replace_once("onClick={() => { updateMode('online'); setStatusText('Condividi il codice o entra in una partita'); }}", "onClick={() => { updateMode('online'); peerSessionRef.current?.setOnlineEnabled(true); setStatusText('Condividi il codice o entra in una partita'); setStatusError(false); }}", 'online mode button')
          replace_once("onClick={() => { updateMode('local'); setStatusText('Pronto per una partita sullo stesso telefono'); }}", "onClick={() => { updateMode('local'); peerSessionRef.current?.setOnlineEnabled(false); setStatusText('Pronto per una partita sullo stesso telefono'); setStatusError(false); }}", 'local mode button')
          replace_once("onChange={event => { const code = normalizeCode(event.target.value); setRemoteId(code); remoteIdRef.current = code; }}", "onChange={event => { const code = normalizeCode(event.target.value); setRemoteId(code); peerSessionRef.current?.setRemoteCode(code); }}", 'remote code input')

          page_path.write_text(text)

          session_path = Path('src/games/forza4/peerSession.ts')
          session = session_path.read_text()
          marker = """  sendMove(col: number, player: Forza4Player) {
          """
          if session.count(marker) != 1:
              raise SystemExit('isConnected insertion marker not found exactly once')
          session = session.replace(marker, """  isConnected() {
            return this.connectionState === 'connected' && Boolean(this.connection?.open);
          }

          sendMove(col: number, player: Forza4Player) {
          """, 1)
          session_path.write_text(session)

      - name: Remove temporary workflow
        run: rm .github/workflows/integrate-forza4-peer-session.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Forza4.tsx src/games/forza4/peerSession.ts .github/workflows/integrate-forza4-peer-session.yml
          git commit -m "refactor: wire Forza 4 peer session controller"
          git push origin HEAD:refactor/forza4-peer-session
