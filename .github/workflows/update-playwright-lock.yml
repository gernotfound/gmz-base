name: Update Playwright lockfile

on:
  push:
    branches:
      - test/browser-smoke
    paths:
      - package.json
      - .github/workflows/update-playwright-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/browser-smoke

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Update lockfile
        run: bun install

      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git rm .github/workflows/update-playwright-lock.yml
          git commit -m "chore: lock Playwright dependency"
          git push origin HEAD:test/browser-smoke
